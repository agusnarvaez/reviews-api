# fly.toml app configuration file for reviews-api
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "reviews-api"
primary_region = "scl"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
